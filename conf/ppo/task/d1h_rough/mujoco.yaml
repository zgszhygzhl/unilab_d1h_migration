# @package _global_
training:
  task_name: d1h_rough
  sim_backend: mujoco
  no_play: true
  play_render_mode: none
  play_steps: 500
  play_env_num: 8
  render_spacing: 0.0

algo:
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 40000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 1.0
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 1.0e-2
    num_learning_epochs: 5
    num_mini_batches: 4
    max_grad_norm: 0.01

env:
  sim_dt: 0.0025
  ctrl_dt: 0.01
  max_episode_seconds: 20.0

  num_actions: 8
  actor_obs_dim: 33
  n_proprio: 33
  n_scan: 187
  history_len: 10
  n_priv_latent: 36
  critic_obs_dim: 586
  policy_obs_dim: 586

  scene:
    model_file: src/unilab/assets/robots/d1h/robot.xml
    fragment_files:
      - src/unilab/assets/robots/d1h/locomotion_task.xml
    terrain:
      hfield_name: terrain_hfield
      geom_name: floor
      generator:
        seed: 42
        curriculum: true
        size: [8.0, 8.0]
        num_rows: 6
        num_cols: 6
        border_width: 1.0
        add_lights: true
        horizontal_scale: 0.05

  terrain_scan:
    enabled: true
    geom_name: floor

  terrain_curriculum:
    enabled: true

  termination_config:
    min_base_height: 0.05
    max_tilt_deg: 50.0
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0

  control_config:
    action_scale: 0.5
    hip_scale_reduction: 0.5
    clip_actions: 1.0
    kp_hip: 40.0
    kd_hip: 1.0
    kp_thigh: 40.0
    kd_thigh: 1.0
    kp_calf: 40.0
    kd_calf: 1.0
    wheel_kp: 10.0
    wheel_kd: 0.5
    torque_limit_leg: 80.0
    torque_limit_wheel: 12.0

  commands:
    vel_limit:
      - [-0.3, -0.5, -0.5]
      - [1.0, 0.5, 0.5]
    commands_proportion: [0.45, 0.1, 0.1, 0.1, 0.05, 0.05, 0.05, 0.05, 0.05]
    resampling_time: 10.0
    heading_command: false
    rel_standing_envs: 0.1
    max_lin_vel_x_change_rate: 0.5
    max_lin_vel_y_change_rate: 0.3
    max_ang_vel_change_rate: 0.5
    enable_command_buffer: true
    buffer_smoothing_factor: 0.1
    flip_same_sign_probability: 0.2

reward:
  scales:
    powers: -2.0e-5
    termination: -100.0
    tracking_lin_vel_x: 15.0
    tracking_lin_vel_y: 5.0
    tracking_ang_vel: 5.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.05
    dof_vel: 0.0
    dof_acc: -2.5e-7
    base_height: -23.0
    feet_air_time: 0.0
    collision: -10.0
    action_rate: -0.1
    stand_still: -1.0
    orientation: -10.0
    no_gait: 1.0
    both_feet_air: -20.0
    body_pos_to_feet_x: 1.0
    body_feet_distance_x: -50.0
    body_feet_distance_y: -100.0
    body_symmetry_y: 0.3
    body_symmetry_z: 0.9
    heading: 0.0
    upward: 1.0
    head_los_distance: -20.0
  tracking_sigma: 0.25
  base_height_target: 0.5
  stand_still_command_threshold: 0.1
  desired_feet_distance: 0.44
  feet_distance_range: [0.36, 0.50]
  head_los_forward_offset: 0.0
  head_los_deadband: 0.05
  head_los_max_distance: 0.35
  both_feet_air_contact_force: 3.0
  both_feet_air_grace_time: 0.02
  both_feet_air_ramp_time: 0.03
